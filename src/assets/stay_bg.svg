  <g class="icon" transform="translate(0, 180)">
    <path d="M-3 -4 A6 6 0 0 0 3 7 A7 7 0 1 1 -3 -4 Z" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6 -5 L6.5 -3.5 L8 -3 L6.5 -2.5 L6 -1 L5.5 -2.5 L4 -3 L5.5 -3.5 Z" stroke-linecap="round" stroke-linejoin="round" class="sparkle" />
    <circle cx="-6" cy="6" r="0.6" class="eye" />
  </g>
  <g class="icon" transform="translate(320, 180)">
    <path d="M-3 -4 A6 6 0 0 0 3 7 A7 7 0 1 1 -3 -4 Z" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6 -5 L6.5 -3.5 L8 -3 L6.5 -2.5 L6 -1 L5.5 -2.5 L4 -3 L5.5 -3.5 Z" stroke-linecap="round" stroke-linejoin="round" class="sparkle" />
    <circle cx="-6" cy="6" r="0.6" class="eye" />
  </g>
  
  <!-- Teapot at (160,180) -->
