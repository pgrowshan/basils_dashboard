    <circle cx="0" cy="2.5" r="5.5" />
    <path d="M-2.5 -3 C-2.5 -4.5 2.5 -4.5 2.5 -3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="-5" r="1" />
    <path d="M-5.5 2 C-7.5 2 -8 1 -8.5 0 C-8.5 0 -7 0 -5.5 1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M5.5 0.5 C7.5 0.5 8.5 2.5 7.5 4.5 C6.5 6.5 4.5 6 4.5 6" stroke-linecap="round" stroke-linejoin="round" />
