    <path d="M2 -3 C2 -4.5 1.5 -6 0.5 -7 C-0.5 -8 -2 -8 -2.5 -7.5 C-3 -7 -3.5 -6 -3.5 -4.5 C-3.5 -3 -2.5 -2 -1.5 -2" stroke-linecap="round" stroke-linejoin="round" />
