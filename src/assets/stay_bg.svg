    <path d="M-9 -7 L-8.5 -6 L-7.5 -6 L-8.5 -5.5 L-8.5 -4.5 L-9 -5.5 L-10 -5.5 L-9 -6 Z M8 3 L8.5 4 L9.5 4 L8.5 4.5 L8.5 5.5 L8 4.5 L7 4.5 L8 4 Z" class="sparkle" />
  </g>
  
