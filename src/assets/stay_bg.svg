    <path d="M-6 -3.5 C-7.5 -2 -8.5 2 -7.5 3.5 C-7 4 -6 3 -6 1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6 -3.5 C7.5 -2 8.5 2 7.5 3.5 C7 4 6 3 6 1" stroke-linecap="round" stroke-linejoin="round" />
