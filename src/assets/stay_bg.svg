    <path d="M0 -5.5 C0 -7.5 2 -8.5 3 -9" stroke-linecap="round" />
    <path d="M0 -5.5 C-2.5 -7 -3 -9 -0.5 -9.5 C1 -9.8 1 -8 0 -5.5 Z" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Mushroom at (240,0) / (240,240) -->
  <g class="icon" transform="translate(240, 0)">
    <path d="M-6 1 C-6 -3.5 2 -3.5 2 1 C0 1.2 -4 1.2 -6 1 Z" stroke-linejoin="round" />
    <path d="M-3 1.1 V6.5 C-3 7.3 -1 7.3 -1 6.5 V1.1" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M0 3 C0 -0.5 6 -0.5 6 3 C4.5 3.1 1.5 3.1 0 3 Z" stroke-linejoin="round" />
    <path d="M2.5 3.1 V7.5 C2.5 8.2 4 8.2 4 7.5 V3.1" stroke-linecap="round" stroke-linejoin="round" />
