    <path d="M-6 -2 C-6 -6.5 6 -6.5 6 -2 C6 1.5 4 2.5 3 3.5 V6 C3 6.5 2 7 1.5 7 H-1.5 C-2 7 -3 6.5 -3 6 V3.5 C-4 2.5 -6 1.5 -6 -2 Z" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-2.5" cy="-1.5" r="1.8" />
