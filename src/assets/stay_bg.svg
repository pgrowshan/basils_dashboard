<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <style>
    .line { stroke: white; stroke-width: 0.8; stroke-dasharray: 3,3; opacity: 0.12; fill: none; }
    .icon { stroke: white; stroke-width: 1.2; fill: none; opacity: 0.15; }
    .sparkle { stroke-width: 0.5; fill: white; }
    .eye { fill: white; }
    .nose { fill: white; }
  </style>
  <g class="line">
    <line x1="0" y1="0" x2="160" y2="240" />
    <line x1="160" y1="0" x2="320" y2="240" />
    <line x1="80" y1="0" x2="240" y2="240" />
    <line x1="240" y1="0" x2="320" y2="120" />
    <line x1="0" y1="120" x2="80" y2="240" />
    
    <line x1="80" y1="0" x2="0" y2="120" />
    <line x1="160" y1="0" x2="0" y2="240" />
    <line x1="240" y1="0" x2="80" y2="240" />
    <line x1="320" y1="0" x2="160" y2="240" />
    <line x1="320" y1="120" x2="240" y2="240" />
  </g>
  
  <!-- Orange at (80,0) / (80,240) -->
