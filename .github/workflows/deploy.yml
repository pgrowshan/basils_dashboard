name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: dashboard-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/basils_dashboard/' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the production API URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "Add the VITE_API_BASE_URL repository secret before deploying."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Add the GitHub Pages route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
