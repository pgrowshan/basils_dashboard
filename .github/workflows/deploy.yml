name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PORT VPS_DEPLOY_PATH; do
            if [ -z "$(printenv "$name")" ]; then
              echo "Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script_stop: true
          envs: VPS_DEPLOY_PATH
          script: |
            set -eu
            export NVM_DIR="${HOME}/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH="/usr/local/bin:/usr/bin:${PATH}"

            cd "$VPS_DEPLOY_PATH"

            restore_env() {
              if [ -f /tmp/.env.basils_dashboard.backup ]; then
                cp /tmp/.env.basils_dashboard.backup .env
              fi
            }

            install_and_build() {
              if [ ! -f .env ]; then
                echo "Missing .env on the server. Create it with VITE_API_BASE_URL before deploying."
                exit 1
              fi
              npm ci
              npm run build
              test -s dist/index.html
            }

            if [ -f .env ]; then
              cp .env /tmp/.env.basils_dashboard.backup
            fi
            previous="$(git rev-parse HEAD)"

            git fetch origin main
            git reset --hard origin/main
            restore_env

            if ! install_and_build; then
              echo "Build failed. Rolling back to $previous"
              git reset --hard "$previous"
              restore_env
              install_and_build
              exit 1
            fi
            echo "Deploy healthy"
